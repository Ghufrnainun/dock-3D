<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101427">
<title>Neo Aqua Dock · Refined</title>
<style>
:root {
  color-scheme:dark;
  --icon-size:70px;
  --icon-gap:9px;
  --edge:16px;
  --shelf-height:39px;
  --spring:cubic-bezier(.16,1,.3,1);
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#eef2ff;
  overflow-x:hidden;
  background:
    radial-gradient(ellipse 52% 55% at 52% 47%,rgba(66,83,149,.26),transparent 76%),
    radial-gradient(ellipse 54% 60% at 85% 7%,rgba(128,64,152,.22),transparent 68%),
    radial-gradient(ellipse 47% 45% at 7% 87%,rgba(26,87,125,.18),transparent 75%),
    linear-gradient(130deg,#0c1127,#171a36 53%,#100f27);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent 28%,rgba(0,0,0,.1));
}
button{font:inherit}
.topbar{height:51px;position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 clamp(18px,3.5vw,48px);border-bottom:1px solid rgba(225,235,255,.065);font-size:11px;letter-spacing:.035em;color:#99a6c7;background:linear-gradient(180deg,#ffffff07,transparent);z-index:5}
.topbar strong{color:#eff4ff;font-weight:700}.brand{display:flex;gap:10px;align-items:center}
.brandmark{height:21px;width:21px;display:grid;place-items:center;color:#102a5a;font-size:13px;border-radius:7px;background:linear-gradient(135deg,#e1efff,#83baff 42%,#31518e);box-shadow:inset 0 1px #fff9,0 2px 10px #6d9dfb55}
.topbar-right{display:flex;gap:18px;align-items:center}
.stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px;padding:82px 12px 92px;isolation:isolate}
.intro{text-align:center;user-select:none;animation:enter .7s both var(--ease)}
.intro .eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.32em;color:#9abbe5}
.intro h1{font-size:clamp(27px,4vw,44px);font-weight:600;line-height:1.1;letter-spacing:-.06em;margin:13px 0 0;color:#e9efff}
.intro p{font-size:13px;color:#8b99b8;margin:12px 0 0}
.dock-wrap{position:relative;max-width:100%;animation:dockIn .85s .08s both var(--spring)}
.dock-wrap::before{content:"";position:absolute;bottom:1px;left:10%;width:80%;height:38px;border-radius:50%;background:#66a5ef33;filter:blur(30px);pointer-events:none}
.dock{
  display:flex;align-items:flex-start;justify-content:center;
  position:relative;isolation:isolate;
  width:max-content;max-width:100%;
  gap:var(--icon-gap);
  padding:0 var(--edge) var(--shelf-height);
}
.app{
  display:block;flex:0 0 var(--icon-size);width:var(--icon-size);height:var(--icon-size);
  position:relative;z-index:3;border:0;border-radius:24%;background:transparent;padding:0;
  cursor:pointer;outline-offset:5px;-webkit-tap-highlight-color:transparent;
  transform-origin:center bottom;
  transform:translate3d(0,calc(-1 * var(--lift,0px)),0) scale(var(--scale,1));
  transition:transform 460ms var(--spring),filter 260ms ease;
  filter:drop-shadow(0 5px 8px rgba(0,0,0,.45));
  will-change:transform;
}
.app:focus-visible{outline:2px solid #c3eaff;z-index:8!important}
.app:is(:hover,:focus-visible){filter:drop-shadow(0 11px 14px rgba(0,0,0,.50))}
.app:active{transition-duration:100ms;filter:brightness(1.1) drop-shadow(0 3px 5px #0008)}
.tile{
  width:100%;height:100%;display:block;position:relative;overflow:hidden;
  border-radius:24%;
  background:var(--tile-bg);
  border:1px solid rgba(235,248,255,.46);
  box-shadow:inset 0 1.5px 1px #fff9,inset 0 -3px 8px #0005,0 3px 8px #0005,0 1px 0 #fff3;
}
.tile::before{content:"";pointer-events:none;position:absolute;top:1px;left:3px;right:3px;height:40%;z-index:2;border-radius:18px 18px 35% 35%;background:linear-gradient(180deg,#ffffff3f,#ffffff0b 58%,transparent)}
.tile::after{content:"";pointer-events:none;position:absolute;inset:3px;z-index:3;border-radius:21%;border:1px solid #ffffff1b}
.tile svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.app--apps{--tile-bg:linear-gradient(140deg,#345f9b,#213c71 63%,#182243)}
.app--projects{--tile-bg:linear-gradient(145deg,#2b7294,#093a5e 63%,#0b2546)}
.app--about{--tile-bg:linear-gradient(145deg,#b156a5,#6f315f 63%,#452048)}
.app--resume{--tile-bg:linear-gradient(145deg,#72a3ed,#365d9e 64%,#243963)}
.app--writing{--tile-bg:linear-gradient(145deg,#414b6c,#1a233f 57%,#0c1229)}
.app--notes{--tile-bg:linear-gradient(145deg,#f4cb80,#df9b4a 63%,#b36e33)}
.app--settings{--tile-bg:linear-gradient(145deg,#7d8caa,#4d597c 56%,#2d3759)}
.app--contact{--tile-bg:linear-gradient(145deg,#e5a1aa,#a95674 63%,#793b57)}
.tooltip{position:absolute;bottom:calc(100% + 18px);left:50%;transform:translate(-50%,5px);padding:7px 11px;border-radius:9px;background:#212941e8;border:1px solid #ffffff29;box-shadow:0 10px 28px #0008;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:11px;font-weight:600;letter-spacing:.02em;color:#edf3ff;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,transform .26s var(--ease),visibility .18s;white-space:nowrap;z-index:10}
.app:is(:hover,:focus-visible) .tooltip{opacity:1;visibility:visible;transform:translate(-50%,0)}
.active-dot{position:absolute;bottom:-20px;left:50%;width:4px;height:4px;border-radius:50%;background:#e7f9ff;box-shadow:0 0 9px #8bd8ff;transform:translateX(-50%) scale(0);transition:transform .35s var(--spring);z-index:7}
.is-active .active-dot{transform:translateX(-50%) scale(1)}
.app.pop .tile{animation:flash .46s var(--spring)}
/* Thin glass base: icon edges stay visible instead of being cut off. */
.shelf{
  position:absolute;z-index:1;bottom:0;left:0;right:0;height:var(--shelf-height);
  overflow:hidden;pointer-events:none;
  border:1px solid #e6f9ff77;border-radius:16px 16px 20px 20px;
  background:
    linear-gradient(180deg,#effcff3c 0%,#c5e6ff25 11%,#567aa132 37%,#719cc02b 63%,#afdbfc2e 88%,#6388b551 100%);
  box-shadow:
    inset 0 2px 2px #fff7,
    inset 0 -2px 4px #143954a3,
    0 12px 24px #0009,
    0 0 15px #8abdfb1b;
  backdrop-filter:blur(19px) saturate(135%);-webkit-backdrop-filter:blur(19px) saturate(135%);
}
.shelf::before{content:"";position:absolute;inset:1px 2px auto;height:7px;border-radius:100% 100% 40% 40%;z-index:4;background:linear-gradient(180deg,#f1fdffa2,transparent);opacity:.62;pointer-events:none}
.shelf::after{content:"";position:absolute;inset:auto 6px 2px;height:5px;border-radius:50%;z-index:5;background:linear-gradient(90deg,transparent,#c5efff29 18%,#eafaff32 50%,#b2dafa27 80%,transparent);filter:blur(2px);pointer-events:none}
.reflections{position:absolute;inset:2px var(--edge) auto;display:flex;gap:var(--icon-gap);z-index:2;opacity:.30;filter:blur(.8px);mask-image:linear-gradient(#0008 0%,transparent 85%);-webkit-mask-image:linear-gradient(#0008 0%,transparent 85%)}
.mirror{flex:0 0 var(--icon-size);width:var(--icon-size);height:var(--icon-size);transform:scaleY(-1)}
.mirror .tile{border-color:transparent;box-shadow:none}
.mirror .tile::before,.mirror .tile::after{display:none}
.shelf-rim{position:absolute;top:0;left:5%;width:90%;height:1px;z-index:5;background:linear-gradient(90deg,transparent,#fff9 18%,#fff8 80%,transparent);box-shadow:0 0 9px #cceeff95;pointer-events:none}
.shelf-glow{position:absolute;top:-8px;left:10%;width:80%;height:29px;z-index:1;background:radial-gradient(ellipse,#eaf8ff24,transparent 70%);pointer-events:none}
.hint{position:absolute;left:50%;top:calc(100% + 28px);transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:11px;letter-spacing:.04em;color:#7e8eae}
.hint kbd{padding:2px 5px;border:1px solid #bdd8ff31;border-radius:5px;font:inherit;color:#a8bbda}
.mobile-hint{display:none}
@media(hover:none){.desktop-hint{display:none}.mobile-hint{display:inline}}
/* Lightweight desktop windows, opened by clicking an app. */
.focus-overlay{position:fixed;inset:0;z-index:20;background:#080d1a48;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility .25s}
.focus-overlay.is-open{opacity:1;visibility:visible;pointer-events:auto}
.window{position:fixed;z-index:21;top:39%;left:50%;width:min(420px,calc(100vw - 32px));background:linear-gradient(145deg,rgba(49,63,91,.95),rgba(19,28,49,.97));border-radius:16px;border:1px solid #e1ecff50;box-shadow:0 28px 95px #000b,inset 0 1px #fff4;backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-39%) translateY(14px) scale(.96);transition:transform .38s var(--spring),opacity .22s ease,visibility .22s;overflow:hidden}
.window.is-open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-39%) translateY(0) scale(1)}
.window.expanded{width:min(690px,calc(100vw - 32px));top:45%;transform:translate(-50%,-45%) scale(1)}
.window-bar{height:43px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid #ffffff20;background:#ffffff0b}
.window-label{font-size:12px;font-weight:600;color:#dceaff}
.traffic{display:flex;gap:8px}.traffic button{height:11px;width:11px;border:0;border-radius:100%;padding:0;cursor:pointer;box-shadow:inset 0 1px #fff9,0 1px 3px #0005}
.traffic button:nth-child(1){background:#fa7075}.traffic button:nth-child(2){background:#efc462}.traffic button:nth-child(3){background:#5bc88a}.window-blank{width:48px}
.window-content{padding:27px 28px 31px}.window-eyebrow{font-size:9px;letter-spacing:.19em;color:#a7cafa;font-weight:800}.window-content h2{margin:10px 0;font-size:26px;letter-spacing:-.04em}.window-content p{margin:0;color:#bcc9dd;line-height:1.75;font-size:13px}.window-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:22px}.window-chips span{font-size:11px;padding:6px 9px;border:1px solid #d8e8ff2b;border-radius:7px;color:#d8e6fc;background:#c6dcff0b}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dockIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes flash{0%,100%{filter:brightness(1)}35%{filter:brightness(1.28)}}
@media(max-width:750px){:root{--icon-size:clamp(41px,7.6vw,60px);--icon-gap:clamp(4px,.9vw,8px);--edge:12px;--shelf-height:33px}.stage{gap:32px}.intro h1{font-size:clamp(26px,5vw,35px)}.hint{top:calc(100% + 23px)}.active-dot{bottom:-18px}}
@media(max-width:430px){:root{--icon-size:clamp(32px,8.9vw,39px);--icon-gap:4px;--edge:9px;--shelf-height:27px}.topbar-right .helper{display:none}.stage{padding-inline:8px;gap:30px}.intro h1{font-size:27px}.intro p{max-width:280px;margin-inline:auto;line-height:1.55}.shelf{border-radius:11px 11px 14px 14px}.tile::before{border-radius:11px 11px 16px 16px}.tooltip{bottom:calc(100% + 13px)}.hint{font-size:10px;top:calc(100% + 21px)}.active-dot{bottom:-15px}.window{top:38%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.app{transform:none!important}}
</style>
</head>

<button aria-label="Open Settings" class="app app--settings" data-app="settings">

  <div class="window-content"><div class="window-eyebrow">YOUR OS / WORKSPACE</div><h2 id="windowTitle">Projects</h2><p id="windowDescription"></p><div class="window-chips" id="windowChips"></div></div>
</section>
<script>
// Replace this demo content with actual pages / links from your portfolio.
const content = {
  apps:{title:'Apps',description:'A little playground for tools, experiments, and things worth trying.',tags:['Playground','Tools','Experiments']},
  projects:{title:'Projects',description:'Selected work, prototypes, and projects built with curiosity and care.',tags:['Case Studies','Web','Creative Coding']},
  about:{title:'About Me',description:'The person behind the pixels, the ideas, and the small details.',tags:['Story','Experience','Interests']},
  resume:{title:'Resume',description:'A compact look at experience, skills, and the journey so far.',tags:['Experience','Skills','Education']},
  writing:{title:'Writing',description:'Long-form thoughts on design, technology, and the spaces between.',tags:['Articles','Essays','Ideas']},
  notes:{title:'Notes',description:'Short thoughts, ideas in progress, and things worth remembering.',tags:['Journal','Snippets','Bookmarks']},
  settings:{title:'Settings',description:'Customize the look and feel of this little desktop.',tags:['Appearance','Interaction','Accessibility']},
  contact:{title:'Contact',description:'A place to start a conversation or work on something interesting together.',tags:['Email','Socials','Collaborate']}
};
const dock=document.getElementById('dock');
const buttons=Array.from(dock.querySelectorAll('.app'));
const reflections=document.getElementById('reflections');
const overlay=document.getElementById('overlay');
const panel=document.getElementById('window');
const fine=matchMedia('(hover:hover) and (pointer:fine)');
const reduced=matchMedia('(prefers-reduced-motion:reduce)');
let pointerX=0,frame=0,lastFocus=null;
// Mirror clones are confined to the glass shelf, so reflections never hang underneath it.
buttons.forEach((button,i)=>{
  const mirror=document.createElement('div');mirror.className='mirror';
  const copy=button.querySelector('.tile').cloneNode(true);
  const svg=copy.querySelector('svg');
  if(svg){
    const idMap={};svg.querySelectorAll('[id]').forEach(el=>{const old=el.id;idMap[old]=old+'-reflection-'+i;el.id=idMap[old]});
    svg.querySelectorAll('*').forEach(el=>{for(const attr of Array.from(el.attributes)){let val=attr.value;for(const [a,b] of Object.entries(idMap)){val=val.replaceAll('url(#'+a+')','url(#'+b+')');if(val==='#'+a)val='#'+b;}if(val!==attr.value)el.setAttribute(attr.name,val)}});
  }
  mirror.appendChild(copy);reflections.appendChild(mirror);
});
function magnify(x){
  if(!fine.matches||reduced.matches)return;
  const dockRect=dock.getBoundingClientRect();
  buttons.forEach(b=>{
    const cx=dockRect.left+b.offsetLeft+b.offsetWidth/2;
    const dist=Math.abs(x-cx);
    const normalized=Math.max(0,1-dist/145);
    const eased=normalized*normalized*(3-2*normalized);
    b.style.setProperty('--scale',(1+.21*eased).toFixed(3));
    b.style.setProperty('--lift',(13*eased).toFixed(2)+'px');
    b.style.zIndex=String(3+Math.round(6*eased));
  });
}
dock.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;pointerX=e.clientX;if(frame)return;frame=requestAnimationFrame(()=>{frame=0;magnify(pointerX)})});
function resetDock(){if(frame)cancelAnimationFrame(frame);frame=0;buttons.forEach(b=>{b.style.setProperty('--scale','1');b.style.setProperty('--lift','0px');b.style.zIndex='3'})}
dock.addEventListener('pointerleave',resetDock);window.addEventListener('blur',resetDock);
function openApp(b){
  const data=content[b.dataset.app];if(!data)return;
  lastFocus=document.activeElement;
  buttons.forEach(el=>el.classList.toggle('is-active',el===b));
  b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
  document.getElementById('windowTitle').textContent=data.title;
  document.getElementById('windowLabel').textContent=data.title;
  document.getElementById('windowDescription').textContent=data.description;
  const chips=document.getElementById('windowChips');chips.replaceChildren(...data.tags.map(tag=>{const s=document.createElement('span');s.textContent=tag;return s}));
  panel.classList.add('is-open');overlay.classList.add('is-open');panel.setAttribute('aria-hidden','false');
  document.getElementById('closeWindow').focus({preventScroll:true});
}
function closeApp(){if(!panel.classList.contains('is-open'))return;panel.classList.remove('is-open','expanded');overlay.classList.remove('is-open');panel.setAttribute('aria-hidden','true');buttons.forEach(b=>b.classList.remove('is-active'));if(lastFocus?.focus)lastFocus.focus({preventScroll:true});}
buttons.forEach((b,i)=>{
  b.addEventListener('click',()=>openApp(b));b.addEventListener('animationend',()=>b.classList.remove('pop'));
  b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();buttons[(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length].focus()}});
});
document.getElementById('closeWindow').addEventListener('click',closeApp);
document.getElementById('minimizeWindow').addEventListener('click',closeApp);
document.getElementById('expandWindow').addEventListener('click',()=>panel.classList.toggle('expanded'));
overlay.addEventListener('click',closeApp);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeApp();if(e.key==='Tab'&&panel.classList.contains('is-open')){const cs=[...panel.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===cs[0]){e.preventDefault();cs.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===cs.at(-1)){e.preventDefault();cs[0].focus()}}});
const clock=document.getElementById('clock');function updateClock(){clock.textContent=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(new Date())}updateClock();setInterval(updateClock,60000);
</script>
