<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%" stop-color="#6660ff" />
      <stop offset="50%" stop-color="#4a40ef" />
      <stop offset="100%" stop-color="#2a1ebc" />
    </linearGradient>
    <linearGradient id="fav-tl" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#ff75f0" />
      <stop offset="100%" stop-color="#cc15e5" />
    </linearGradient>
    <linearGradient id="fav-tr" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#5bfbe4" />
      <stop offset="100%" stop-color="#0bb4c4" />
    </linearGradient>
    <linearGradient id="fav-bl" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#ffd066" />
      <stop offset="100%" stop-color="#e06e14" />
    </linearGradient>
    <linearGradient id="fav-br" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#5caaff" />
      <stop offset="100%" stop-color="#1846ea" />
    </linearGradient>
    <linearGradient id="fav-rim" x1="0%" y1="0%" x2="0%" y2="100%">
