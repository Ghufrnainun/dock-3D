  <g clip-path="url(#fav-clip)">
    <rect x="23" y="23" width="32" height="32" rx="9" fill="url(#fav-tl)" />
    <rect x="65" y="23" width="32" height="32" rx="9" fill="url(#fav-tr)" />
    <rect x="23" y="65" width="32" height="32" rx="9" fill="url(#fav-bl)" />
    <rect x="65" y="65" width="32" height="32" rx="9" fill="url(#fav-br)" />
  </g>

  <!-- Specular Outer Rim -->
  <path d="M 31 6 H 89 C 105.5 6 114 14.5 114 31 V 89 C 114 105.5 105.5 114 89 114 H 31 C 14.5 114 6 105.5 6 89 V 31 C 6 14.5 14.5 6 31 6 Z" fill="none" stroke="url(#fav-rim)" stroke-width="2.2" />
