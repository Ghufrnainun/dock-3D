      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="fav-glow" cx="50%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="fav-clip">
      <path d="M 31 6 H 89 C 105.5 6 114 14.5 114 31 V 89 C 114 105.5 105.5 114 89 114 H 31 C 14.5 114 6 105.5 6 89 V 31 C 6 14.5 14.5 6 31 6 Z" />
